# NEXCOUNT – Datenbank-Migrationen aus supabase/migrations automatisch in Supabase einspielen
#
# Einmalig nötig (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN  – Supabase → Account → Access Tokens → „Generate new token“
#   SUPABASE_DB_PASSWORD   – das Datenbank-Passwort, das beim Anlegen des Projekts erzeugt wurde
# Ohne diese Secrets wird der Schritt mit einem Hinweis übersprungen (kein Fehler).
name: Supabase-Datenbank

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-db
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrationen einspielen
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: xrzovtfaqthaxucaoale
    steps:
      - name: Zugangsdaten prüfen
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning title=Supabase nicht verbunden::Die Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_DB_PASSWORD fehlen (Settings → Secrets and variables → Actions). Migrationen wurden übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Mit dem Supabase-Projekt verbinden
        if: steps.check.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Neue Migrationen einspielen
        if: steps.check.outputs.ready == 'true'
        run: supabase db push --include-all
